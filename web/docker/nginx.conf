# PrecioLocal ER — nginx (frontend + proxy del API hacia el servicio scraper).
# Cafés: SPA con fallback a index.html; las rutas del API se proxyan
# same-origin hacia http://scraper:8000.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cabeceras de seguridad (docs/security.md §5) aplicadas a TODAS las
    # respuestas; HSTS solo cuando el front llegue por HTTPS (deploy nube).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Rutas del API → scraper (same-origin para el frontend).
    # `chains` va acá porque alimenta el selector de cadena del front; si se
    # curea, cae en `location /` y devuelve index.html en vez de JSON.
    # `scrape` NO va acá: es superficie de escritura y va con su propio `deny`
    # más abajo. Para dispararlo se usa el puerto del scraper (make scrape,
    # curl localhost:8000/scrape/run/<chain>), nunca el dominio público.
    location ~ ^/(health|ready|chains|products|ml)(/.*)?$ {
        proxy_pass http://scraper:8000;
        proxy_set_header Host $host;
        # `$remote_addr`, NO `$proxy_add_x_forwarded_for`: el segundo hace
        # append del XFF entrante, así que un cliente podía mandar
        # `X-Forwarded-For: <IP-falsa>` y el scraper leía ese valor como IP de
        # cliente (el primero de la lista), esquivando su rate limit. Acá se
        # sobreescribe: lo que llega al scraper es siempre el peer real.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Escribir de verdad: `POST /scrape/run/{chain}` dispara scraping contra
    # sitios externos. No se expone por el dominio público ni aunque venga con
    # `X-Admin-Token` correcto (ese token sigue sirviendo para el puerto local
    # del scraper). Sin este bloque, quitar `scrape` del regex de arriba lo
    # mandaría a la SPA y devolvería index.html con 200: un fallo silencioso
    # que parece un scrape exitoso. 403 explícito y verificable.
    location ~ ^/scrape(/.*)?$ {
        deny all;
    }

    # Rutas del API .NET (reportes y forecast ML.NET) → ml-dotnet.
    location ~ ^/api(/.*)?$ {
        proxy_pass http://ml-dotnet:8001;
        proxy_set_header Host $host;
        # Mismo criterio que el scraper: una IP de cliente, la real.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Rutas del Gateway GraphQL → gateway.
    # /graphql para queries/mutations, /ws para subscriptions (WebSocket).
    location ~ ^/(graphql|ws)(/.*)?$ {
        proxy_pass http://gateway:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        # WebSocket upgrade
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # SPA: rutas propias caen a index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Caché larga para assets con hash; ngsw.json SIEMPRE fresco.
    # (los add_header locales sobreescriben los del server → repetir seguridad)
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri =404;
    }

    location = /ngsw.json {
        expires -1;
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # Evitar que se sirvan archivos sueltos del repo.
    location ~ /\. {
        deny all;
    }
}