<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0b6b3a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#14a852;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="256" cy="256" r="256" fill="url(#grad)"/>
  
  <!-- Shopping cart icon -->
  <g fill="white" transform="translate(80, 120) scale(0.8)">
    <!-- Cart body -->
    <path d="M40 200 L60 200 L70 120 L30 120 Z" fill="white"/>
    <path d="M30 120 L20 40 L110 40 L100 120 Z" fill="white" opacity="0.9"/>
    <!-- Cart handle -->
    <path d="M100 40 L130 20 L140 30 L110 50 Z" fill="white" opacity="0.8"/>
    <!-- Wheels -->
    <circle cx="50" cy="210" r="18" fill="white" opacity="0.9"/>
    <circle cx="50" cy="210" r="8" fill="url(#grad)"/>
    <circle cx="100" cy="210" r="18" fill="white" opacity="0.9"/>
    <circle cx="100" cy="210" r="8" fill="url(#grad)"/>
    <!-- Price tag -->
    <path d="M180 100 L220 100 L240 120 L220 140 L180 140 L160 120 Z" fill="white" opacity="0.95"/>
    <text x="200" y="125" text-anchor="middle" fill="#0b6b3a" font-size="40" font-weight="bold" font-family="system-ui">$</text>
  </g>
  
  <!-- Location pin for Entre Ríos -->
  <g fill="white" transform="translate(320, 300) scale(0.6)">
    <path d="M160 40 C160 18 142 0 120 0 C98 0 80 18 80 40 C80 70 120 160 120 160 C120 160 160 70 160 40 Z" fill="white"/>
    <circle cx="120" cy="40" r="20" fill="#0b6b3a"/>
    <text x="120" y="52" text-anchor="middle" fill="white" font-size="24" font-weight="bold" font-family="system-ui">ER</text>
  </g>
</svg>