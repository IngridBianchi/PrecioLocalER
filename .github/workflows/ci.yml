name: CI

on:
  pull_request:
  push:
    # El repo está en `master` (y todavía sin commits). Con trigger en `main`
    # los tres workflows nunca se ejecutaron, así que el "verde" anterior era
    # ausencia de ejecución, no tests pasando. Si algún día se renombra la
    # rama a `main`, este trigger tiene que cambiar con ella.
    branches: [master, main]

# Hardening WP1: permisos mínimos por default (A05). El job que
# necesita escribir (publicar cobertura en PR) lo pide explícitamente.
permissions:
  contents: read

jobs:
  validate-infrastructure:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Valida docker-compose.yml
        # `docker compose config` interpola TODO el archivo, aunque el perfil
        # `analytics` no esté activo. Sin estas variables el job falla por
        # `${VAR:?falta ...}` antes de validar una sola línea de YAML.
        env:
          POSTGRES_PASSWORD: ci-config-only
          MONGO_PASSWORD: ci-config-only
          REDIS_PASSWORD: ci-config-only
          SCRAPER_DB_PASSWORD: ci-config-only
          ML_DB_PASSWORD: ci-config-only
          ANALYTICS_DB_PASSWORD: ci-config-only
          TRUSTED_PROXY_IP: 10.99.0.10
          SUPABASE_JWKS_URL: ""
        run: docker compose config --quiet

      - name: Valida estructura de docs/ADRs
        run: |
          for f in docs/adr/0001-multiples-lenguajes.md \
                   docs/adr/0002-graphql-vs-rest.md \
                   docs/adr/0003-webflux-para-alertas.md \
                   docs/adr/0004-mongodb-como-timeseries.md \
                   docs/adr/0005-redis-cache-lock-pubsub.md \
                   docs/adr/0006-dos-modelos-ml.md \
                   docs/adr/0007-render-cold-start-consciente.md \
                   docs/adr/0008-no-microfrontends-no-k8s.md; do
            test -f "$f" || { echo "Falta $f"; exit 1; }
          done
          echo "ADRs OK"

      - name: Valida README referenciado en docs
        run: |
          test -f README.md || { echo "Falta README.md"; exit 1; }
          test -f docs/architecture.md || { echo "Falta architecture.md"; exit 1; }
          test -f docs/contracts.md  || { echo "Falta contracts.md"; exit 1; }
          echo "Docs OK"

  scraper-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: services/scraper
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/scraper/requirements.lock
      - name: Instala dependencias (lockfile)
        run: |
          pip install -r requirements.lock
          pip install --no-deps -e .
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check app tests
      - name: MyPy
        run: mypy app

  scraper-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: services/scraper

    # Postgres de servicio para los integration tests. Sin esto, los 151 tests
    # de `tests/integration/` hacen skip por `TEST_DATABASE_URL` ausente y el
    # job pasa en verde sin haber ejecutado casi la mitad de la suite: el mismo
    # agujero por el que entraron el bug de la política RLS duplicada (007) y
    # el de la regex de presentación.
    #
    # `services/scraper/tests/integration/conftest.py` tira la base y la
    # recrea aplicando las migraciones del repo, así que el healthcheck solo
    # tiene que esperar a que el servidor acepte conexiones.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: preciolocal
          POSTGRES_PASSWORD: test-password-not-a-secret
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U preciolocal"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/scraper/requirements.lock
      - name: Instala dependencias (lockfile)
        run: |
          pip install -r requirements.lock
          pip install --no-deps -e .
          pip install -e ".[test,dev]"

      # El conftest deriva la URL de admin reemplazando el path, así que alcanza
      # con darle la de test: `preciolocal_test` (prohibida: `preciolocal`).
      #
      # El XML de JUnit se usa para el paso siguiente: `pytest` no deja un
      # archivo con los skips, así que "pasó" y "se saltó media suite" se ven
      # igual en el exit code.
      - name: Pytest (unit + integration, con Postgres real)
        env:
          TEST_DATABASE_URL: >-
            postgresql://preciolocal:test-password-not-a-secret@localhost:5432/preciolocal_test
        run: >-
          pytest -q
          --junitxml=pytest-report.xml
          --cov=app --cov-report=term --cov-report=xml

      # Un skip acá significa que `TEST_DATABASE_URL` no llegó al conftest y que
      # los 151 integration tests no se ejecutaron. Es exactamente el falso
      # verde que había antes, así que se trata como error.
      - name: Falla si algún test fue skippeado
        if: always()
        run: |
          python - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse("pytest-report.xml").getroot()
          suites = [root] if root.tag == "testsuite" else list(root)
          skipped = sum(int(s.get("skipped", 0) or 0) for s in suites)
          total = sum(int(s.get("tests", 0) or 0) for s in suites)
          print(f"{total} tests, {skipped} skippeados")
          if skipped:
              sys.exit(f"::error::{skipped} tests skippeados: la suite de integración no corrió")
          PY

      - name: Sube cobertura a Codecov
        uses: codecov/codecov-action@v5
        with:
          files: services/scraper/coverage.xml
          fail_ci_if_error: true
          verbose: true

  web-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Instala dependencias
        run: npm ci --legacy-peer-deps
      - name: Tests (Karma/ChromeHeadless)
        run: npx ng test --watch=false --browsers=ChromeHeadless
      - name: Build de producción
        run: npm run build

  gateway-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: services/gateway
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/gateway/package-lock.json
      - name: Instala dependencias (lockfile)
        run: npm ci
      - name: Tests (Vitest)
        run: npm test
      - name: Build (tsc)
        run: npm run build

  web-e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/scraper/requirements.lock

      # Este job es el único que levanta la topología completa, así que es el
      # primero en poder*correr* los tests de integración del scraper. Si el
      # pull request rompe una migración, el rojo aparece acá (y no después,
      # en un deploy).
      - name: Credenciales efímeras para compose
        # El compose falla a propósito si faltan las passwords (`${VAR:?falta
        # POSTGRES_PASSWORD}`), así que hay que escribirlas. Son de descarte:
        # viven solo en el runner.
        #
        # Se edita `.env` con `sed` y no se appendea: `.env.example` ya trae
        # `DATABASE_URL` y `MONGO_URL` con placeholders `<POSTGRES_PASSWORD>`, y
        # duplicar la clave dejaría un `.env` con dos valores para lo mismo
        # (gana el último, pero por un detalle del parser, no por intención).
        run: |
          cp .env.example .env
          pw=e2e-password-not-a-secret
          sed -i \
            -e "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=$pw|" \
            -e "s|^MONGO_PASSWORD=.*|MONGO_PASSWORD=$pw|" \
            -e "s|^REDIS_PASSWORD=.*|REDIS_PASSWORD=$pw|" \
            -e "s|^ADMIN_TOKEN=.*|ADMIN_TOKEN=e2e-admin-token-not-a-secret|" \
            -e "s|^DATABASE_URL=.*|DATABASE_URL=postgresql://preciolocal:$pw@localhost:5432/preciolocal|" \
            -e "s|^MONGO_URL=.*|MONGO_URL=mongodb://preciolocal:$pw@localhost:27018/preciolocal?authSource=admin|" \
            .env
          # El E2E de browser entra entero por nginx, o sea con una sola IP de
          # origen: con el default de la app (30/min, OWASP A04) la suite se
          # muere de 429 a mitad de camino. Solo en CI.
          echo "RATE_LIMIT_REQUESTS_PER_MINUTE=1000" >> .env
          docker compose config --quiet && echo "compose OK"
          # `Settings` de pydantic lee `.env` del cwd, así que los scripts de
          # demo/train toman la URL de acá sin necesidad de un `export`.
          grep -E '^(POSTGRES_PASSWORD|DATABASE_URL)=' .env | sed 's/=.*/=<set>/'

      - name: Levanta la stack (migraciones + scraper + ml-dotnet + gateway + web)
        run: |
          docker compose up -d --build
          ./scripts/pl.sh health

      # El gateway no tiene healthcheck en compose (no queremos que `pl.sh
      # health` espere un séptimo contenedor healthy), así que el E2E espera
      # explícitamente a que /graphql esté escuchando. Sin esto, la primera
      # búsqueda puede salir antes de que Fastify termine de arrancar.
      - name: Espera al gateway GraphQL
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4000/health >/dev/null; then
              echo "gateway listo"
              exit 0
            fi
            sleep 2
          done
          docker compose logs gateway
          exit 1

      - name: Instala dependencias de los scripts de demo/train
        working-directory: services/scraper
        run: |
          pip install -r requirements.lock
          pip install --no-deps -e .
          pip install -e ".[dev]"

      # Los productos scrapeados son de una sola cadena cada uno, así que no hay
      # nada comparable entre cadenas con el catálogo real: la comparación
      # multi-cadena del front se apoya en los datos DEMO. Sin esto, el job
      # correría verde sin ejecutar un solo assertion de la UI de cadenas.
      - name: Datos E2E (DEMO-* + forecasts)
        run: |
          ./scripts/pl.sh e2e-data

      - name: Dependencias de web
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: E2E de navegador contra la topología real (nginx incluido)
        working-directory: web
        run: npx playwright test

      - name: Sube trazas y capturas si algo falla
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-artifacts
          path: web/e2e/.artifacts
          retention-days: 7
          if-no-files-found: ignore

  dotnet-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: services/ml-dotnet
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # El SVD de SsaForecaster es Intel MKL: en Linux libMklImports.so
      # necesita libiomp5.so, que no está en la imagen del SDK. Mismo script
      # que usa el Dockerfile, para que CI y producción ejecuten el mismo
      # runtime y los tests no pasen degradados sin querer.
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "8.0.x"

      - name: Instala el runtime de Intel OpenMP (libiomp5.so)
        run: sudo bash scripts/install-mkl-runtime.sh

      - name: Build
        run: dotnet build -c Release

      - name: Tests
        run: dotnet test -c Release --no-build

  analytics-java-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 25
    defaults:
      run:
        working-directory: services/analytics-java
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: services/analytics-java/pom.xml
      # Testcontainers usa el Docker del runner para Postgres/Mongo/Redis; no
      # hacen falta service containers. `verify` compila, corre unitarios +
      # integración y empaqueta el jar que después consume el Dockerfile.
      - name: Tests + package (Testcontainers)
        run: mvn -B verify
