[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "preciolocal-scraper"
version = "0.1.0"
description = "Scraper + normalizacion de PrecioLocal ER (Fase 1: La Anonima)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "asyncpg>=0.29",
    "orjson>=3.10",
    "beautifulsoup4>=4.12",
    "redis>=5.0",
    "slowapi>=0.1.9",
    "prometheus-fastapi-instrumentator>=7.0",
]

[project.optional-dependencies]
server = [
    "uvicorn[standard]>=0.30",
]
observability = [
    "opentelemetry-api>=1.22",
    "opentelemetry-sdk>=1.22",
    "opentelemetry-exporter-otlp>=1.22",
    # instrumentations están en beta, usarlas con pin si se necesitan:
    # "opentelemetry-instrumentation-fastapi>=0.42b0",
    # "opentelemetry-instrumentation-httpx>=0.42b0",
    # "opentelemetry-instrumentation-asyncpg>=0.42b0",
    # "opentelemetry-instrumentation-redis>=0.42b0",
    # "opentelemetry-instrumentation-logging>=0.42b0",
]
test = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "anyio>=4.4",
]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
]
# ML pesado (ADR-0006). Opcional a propósito: sin esto el servicio usa
# los fallbacks puros de app/ml (Holt-Winters + robust-zscore) y los
# tests corren igual. Instalar con `pip install -e ".[ml]"`.
ml = [
    "numpy>=1.26",
    "statsmodels>=0.14",
    "scikit-learn>=1.5",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Los fixtures de sesión (el pool de Postgres de los tests de integración)
# necesitan su propio loop; el resto sigue con el loop por test.
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra --cov=app --cov-report=term-missing"
# "." para el paquete `app`; "../.." para que los jobs de `scripts/` (que no son
# un paquete) se puedan importar y testear: `train_forecasts` y
# `seed_demo_history` son código de producción y quedaban sin cubrir si no.
pythonpath = [".", "../.."]
markers = [
    "integration: requiere TEST_DATABASE_URL contra un Postgres real",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_redundant_casts = true
warn_unused_configs = true
ignore_missing_imports = true